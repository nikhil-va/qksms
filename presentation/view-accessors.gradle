/*
 * Generates findViewById accessors for every view with an id in res/layout, as a drop-in replacement for
 * the Kotlin Android Extensions synthetics that were removed in Kotlin 1.8.
 *
 * For a layout foo_activity.xml containing @+id/bar, this generates:
 *   com.moez.QKSMS.synthetic.foo_activity       -> Activity.bar, LayoutContainer.bar
 *   com.moez.QKSMS.synthetic.foo_activity.view  -> View.bar
 *
 * An <include> with an id gets an accessor in the including layout; the views inside an included layout are
 * accessed through that layout's own package, e.g. import com.moez.QKSMS.synthetic.toolbar.*
 * Unlike the synthetics, lookups aren't cached. New screens should use ViewBinding (enabled in build.gradle).
 */

import javax.xml.parsers.DocumentBuilderFactory
import org.w3c.dom.Element

abstract class GenerateViewAccessors extends DefaultTask {

    static final String ANDROID_NS = "http://schemas.android.com/apk/res/android"
    static final Set<String> ANDROID_VIEW_CLASSES = ["View", "ViewGroup", "ViewStub", "SurfaceView", "TextureView"] as Set
    static final Set<String> KOTLIN_KEYWORDS = ["as", "break", "class", "continue", "do", "else", "false", "for", "fun", "if",
            "in", "interface", "is", "null", "object", "package", "return", "super", "this", "throw", "true", "try", "typealias",
            "typeof", "val", "var", "when", "while"] as Set

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getLayoutDir()

    @Input
    abstract Property<String> getRPackage()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def out = outputDir.get().asFile
        project.delete(out)

        def factory = DocumentBuilderFactory.newInstance()
        factory.namespaceAware = true
        def layouts = [:]
        layoutDir.get().asFile.listFiles().findAll { it.name.endsWith(".xml") }.each { file ->
            layouts[file.name - ".xml"] = factory.newDocumentBuilder().parse(file).documentElement
        }

        layouts.each { String name, Element root ->
            def views = new LinkedHashMap<String, String>()
            collectViews(root, layouts, views)
            if (views.isEmpty()) return

            def pkg = "com.moez.QKSMS.synthetic.${name}"
            // No declared types: the accessors get the platform types returned by ViewFinder, like the old synthetics
            writeFile(out, pkg, name, views, [
                    "import android.app.Activity",
                    "import com.moez.QKSMS.synthetic.LayoutContainer",
                    "import com.moez.QKSMS.synthetic.ViewFinder"
            ]) { String property, String type, String id ->
                "val Activity.${property} get() = ViewFinder.find<${type}>(this, ${id})\n" +
                        "val LayoutContainer.${property} get() = ViewFinder.find<${type}>(this, ${id})\n"
            }
            writeFile(out, "${pkg}.view", name, views, [
                    "import android.view.View",
                    "import com.moez.QKSMS.synthetic.ViewFinder"
            ]) { String property, String type, String id ->
                "val View.${property} get() = ViewFinder.find<${type}>(this, ${id})\n"
            }
        }
    }

    /** Adds id -> view class for this element and its children */
    void collectViews(Element element, Map<String, Element> layouts, Map<String, String> views) {
        def tag = element.tagName
        def id = idOf(element)
        if (tag == "include") {
            def included = layouts[element.getAttribute("layout") - "@layout/"]
            if (id != null && included != null && included.tagName != "merge") {
                views.putIfAbsent(id, classOf(included.tagName))
            }
            return
        }

        if (id != null && tag != "merge" && tag != "fragment") {
            views.putIfAbsent(id, classOf(tag))
        }
        element.childNodes.findAll { it instanceof Element }.each { child -> collectViews(child as Element, layouts, views) }
    }

    static String idOf(Element element) {
        def id = element.getAttributeNS(ANDROID_NS, "id")
        return id?.startsWith("@+id/") ? id - "@+id/" : null
    }

    static String classOf(String tag) {
        if (tag.contains(".")) return tag
        if (tag in ANDROID_VIEW_CLASSES) return "android.view.${tag}"
        if (tag == "WebView") return "android.webkit.WebView"
        return "android.widget.${tag}"
    }

    void writeFile(File out, String pkg, String layout, Map<String, String> views, List<String> imports, Closure<String> accessor) {
        def file = new File(out, pkg.replace('.', '/') + "/ViewAccessors.kt")
        file.parentFile.mkdirs()
        def body = new StringBuilder()
        body << "// Generated by presentation/view-accessors.gradle from res/layout/${layout}.xml. Do not edit.\n"
        body << "@file:Suppress(\"unused\", \"RemoveExplicitTypeArguments\")\n\n"
        body << "package ${pkg}\n\n"
        imports.each { body << it << "\n" }
        body << "import ${RPackage.get()}.R\n\n"
        views.each { id, type ->
            def property = id in KOTLIN_KEYWORDS ? "`${id}`" : id
            body << accessor.call(property, type, "R.id.${id}")
        }
        file.text = body.toString()
    }
}

def generateViewAccessors = tasks.register("generateViewAccessors", GenerateViewAccessors) {
    layoutDir = project.layout.projectDirectory.dir("src/main/res/layout")
    RPackage = android.namespace
    outputDir = project.layout.buildDirectory.dir("generated/source/viewAccessors")
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generateViewAccessors) { it.outputDir }
    }
}
